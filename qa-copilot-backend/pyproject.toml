[project]
name = "rag-fastapi"
version = "0.1.0"
description = "企业知识库 Agent FastAPI 后端"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis[hiredis]>=5.2",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "PyJWT[crypto]>=2.10",
  "pwdlib[argon2]>=0.2",
  "tenacity>=9.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-text-splitters>=0.3",
  "langgraph>=0.2",
  "mcp>=1.26,<2",
  "qdrant-client>=1.12",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "tiktoken>=0.8",
  "cryptography>=50.0.0",
  "pyrefly>=0.60.0",
  "pgvector>=0.5.0",
  "celery[redis]>=5.5",
  "celery-types>=0.26.0",
  "prometheus-client>=0.21",
  "pytest>=8.3",
  "openpyxl>=3.1",
  "pymysql>=1.1",
  "croniter>=6.0",
  "playwright>=1.55",
  "PyYAML>=6.0",
  "sqlglot>=27.0",
]

[project.optional-dependencies]
agent = [
  "langchain>=0.3",
  "langchain-community>=0.3",
]
storage = [
  "minio>=7.2",
]
eval = [
  "ragas>=0.2",
  "deepeval>=2.0",
  "langsmith>=0.2",
]
dev = [
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
  "ty>=0.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
